name: Generar EXE con UCRT
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x86'

    - name: Instalar dependencias
      run: |
        pip install uploadserver pyinstaller==5.13.2

    - name: Compilar incluyendo librerías de sistema
      run: |
        # Intentamos forzar la inclusión de las librerías de tiempo de ejecución de C
        pyinstaller --onedir --console --name "Servidor_Win7_UCRT" --add-binary "C:\Windows\SysWOW64\ucrtbase.dll;." lanzador.py

    - name: Subir
      uses: actions/upload-artifact@v4
      with:
        name: Servidor_Con_UCRT
        path: dist/Servidor_Win7_UCRT/
