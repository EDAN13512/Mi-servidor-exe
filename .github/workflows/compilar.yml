name: Generar Carpeta Super Compatible
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x86'

    - name: Instalar Dependencias
      run: |
        pip install uploadserver pyinstaller

    - name: Compilar en modo Carpeta
      run: |
        # Usamos --onedir en lugar de --onefile
        pyinstaller --onedir --console --name "Servidor_Win7_Carpeta" --collect-all uploadserver lanzador.py

    - name: Subir Carpeta Completa
      uses: actions/upload-artifact@v4
      with:
        name: Servidor_Listo_Para_Win7
        path: dist/Servidor_Win7_Carpeta/
