name: Generar EXE Super Compatible
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2019 # Usamos una versión de Windows server más compatible
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x86'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install uploadserver pyinstaller

    - name: Compilar con Librerías Incluidas
      run: |
        # El comando --collect-all intenta meter todas las dependencias ocultas
        pyinstaller --onefile --console --name "Servidor_Final" --collect-all uploadserver --clean lanzador.py

    - name: Subir Archivo
      uses: actions/upload-artifact@v4
      with:
        name: EXE_Windows7_Corregido
        path: dist/Servidor_Final.exe
